name: Security Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  security_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version comes from .ruby-version; runs 'bundle install' and caches gems
          bundler-cache: true

      - name: Run Bundler Audit
        run: |
          bundle exec bundle-audit check --update

      - name: Run Brakeman
        run: |
          bundle exec brakeman --no-pager

      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        id: Depcheck
        with:
          project: 'test'
          path: '.'
          format: 'HTML'
          out: 'reports' # this is the default, no need to specify unless you wish to override it
          # vendor/bundle holds gems installed by setup-ruby; Gemfile.lock is already covered by bundle-audit.
          args: >
            --failOnCVSS 7
            --enableRetired
            --exclude "**/vendor/bundle/**"

      - name: Upload Test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Depcheck report
          path: ${{github.workspace}}/reports
